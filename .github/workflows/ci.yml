name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["site/**", "**.md"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.swift', 'Sources/**') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Toolchain
        run: swift --version

      - name: Build
        run: swift build -c release

      - name: Bundle the app
        run: ./scripts/bundle.sh

      - name: Check the bundle
        run: |
          plutil -lint dist/AIKeeper.app/Contents/Info.plist
          test -f dist/AIKeeper.app/Contents/Resources/AppIcon.icns
          codesign --verify --deep --strict dist/AIKeeper.app

      - name: Smoke test the command line
        run: |
          dist/AIKeeper.app/Contents/MacOS/AIKeeper help
          dist/AIKeeper.app/Contents/MacOS/AIKeeper status
